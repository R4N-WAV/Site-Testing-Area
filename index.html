<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>R4N</title>
  <meta name="description" content="R4N — music. Every record is a planet." />
  <meta name="theme-color" content="#050506" />
  <link rel="icon" type="image/png" href="assets/icon.png" />
  <link rel="stylesheet" href="css/site.css" />
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/controls/OrbitControls.js": "./vendor/OrbitControls.js"
    } }
  </script>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="top">
    <a href="./" class="logo" aria-label="R4N home"><img src="assets/logo-white.png" alt="R4N" /></a>
    <button class="textBtn" id="indexBtn" type="button" aria-expanded="false" aria-controls="index">INDEX</button>
  </header>

  <p class="hint" id="hint">DRAG TO DRIFT &nbsp;·&nbsp; CLICK A RECORD</p>

  <nav class="socials" aria-label="Social links">
    <a href="https://www.instagram.com/r4n.wav/" target="_blank" rel="noopener">instagram</a>
    <span>/</span>
    <a href="https://open.spotify.com/artist/2RhtCG7SVNhfYCBHkpFvFr" target="_blank" rel="noopener">spotify</a>
    <span>/</span>
    <a href="mailto:r4nmusic@outlook.com">contact</a>
  </nav>

  <!-- List of every release: the INDEX button, and the fallback when 3D isn't available -->
  <section class="index" id="index" aria-label="All releases" hidden>
    <ol class="index__list" id="indexList"></ol>
  </section>

  <!-- Detail panel for one release -->
  <aside class="panel" id="panel" aria-label="Release details" aria-hidden="true">
    <button class="textBtn panel__close" id="panelClose" type="button" aria-label="Close">CLOSE ✕</button>
    <div class="panel__scroll">
      <img class="panel__cover" id="pCover" alt="" />
      <p class="panel__meta" id="pMeta"></p>
      <h1 class="panel__title" id="pTitle"></h1>
      <p class="panel__artist" id="pArtist"></p>
      <div class="panel__desc" id="pDesc"></div>
      <dl class="panel__credits" id="pCredits"></dl>
      <div class="panel__links" id="pLinks"></div>
      <div class="panel__nav">
        <button class="textBtn" id="pPrev" type="button">← PREV</button>
        <button class="textBtn" id="pNext" type="button">NEXT →</button>
      </div>
    </div>
  </aside>

  <div class="loader" id="loader" role="status"><span id="loaderText">TUNING IN</span></div>

  <noscript><p class="noscript">This site needs JavaScript. Find R4N on <a href="https://open.spotify.com/artist/2RhtCG7SVNhfYCBHkpFvFr">Spotify</a>.</p></noscript>

  <script type="module" src="js/site.js"></script>
</body>
</html>
